[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citeguard"
version = "0.1.0"
description = "CiteGuard — hybrid retrieval Week 1 (Agentic RAG portfolio)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "qdrant-client>=1.12.0",
  "rank-bm25>=0.2.2",
  "fastembed>=0.4.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "numpy>=1.26.0",
  "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/citeguard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
